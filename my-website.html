<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Travel Site</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
  }

  /* Header */
  header {
    background: #1a73e8;
    color: white;
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 24px; }
  nav a {
    color: white;
    text-decoration: none;
    margin-left: 25px;
    font-size: 15px;
  }
  nav a:hover { text-decoration: underline; }

  /* Hero */
  .hero {
    background: linear-gradient(135deg, #1a73e8, #6dd5ed);
    padding: 60px 20px;
    text-align: center;
    color: white;
  }
  .hero h2 { font-size: 32px; margin-bottom: 10px; }
  .hero p { font-size: 16px; opacity: 0.9; }

  /* Search box */
  .search-box {
    max-width: 900px;
    margin: -40px auto 0 auto;
    background: white;
    border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    padding: 25px;
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    position: relative;
  }
  .search-box .field {
    flex: 1;
    min-width: 150px;
    display: flex;
    flex-direction: column;
  }
  .search-box label {
    font-size: 12px;
    color: #666;
    margin-bottom: 5px;
    font-weight: bold;
  }
  .search-box input {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
  }
  .search-box button {
    background: #ff6b35;
    color: white;
    border: none;
    padding: 0 25px;
    border-radius: 6px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    align-self: flex-end;
    height: 42px;
  }
  .search-box button:hover { background: #e85a2a; }

  /* Destinations */
  .destinations {
    max-width: 1000px;
    margin: 80px auto 40px auto;
    padding: 0 20px;
  }
  .destinations h3 {
    margin-bottom: 20px;
    font-size: 22px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
  }
  .card {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: transform 0.2s;
  }
  .card:hover { transform: translateY(-5px); }
  .card img { width: 100%; height: 140px; object-fit: cover; }
  .card-body { padding: 15px; }
  .card-body h4 { font-size: 16px; margin-bottom: 5px; }
  .card-body p { font-size: 13px; color: #777; }

  footer {
    text-align: center;
    padding: 20px;
    color: #888;
    font-size: 13px;
    margin-top: 60px;
  }
</style>
</head>
<body>

  <header>
    <h1>MyTravelSite</h1>
    <nav>
      <a href="#">Flights</a>
      <a href="#">Hotels</a>
      <a href="#">Trains</a>
      <a href="#">Login</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Find your next trip</h2>
    <p>Search flights and hotels at the best prices</p>
  </section>

  <form class="search-box" onsubmit="handleSearch(event)">
    <div class="field">
      <label>FROM</label>
      <input type="text" id="from" placeholder="City or Airport" required>
    </div>
    <div class="field">
      <label>TO</label>
      <input type="text" id="to" placeholder="City or Airport" required>
    </div>
    <div class="field">
      <label>DEPARTURE</label>
      <input type="date" id="departure" required>
    </div>
    <div class="field">
      <label>RETURN</label>
      <input type="date" id="return">
    </div>
    <button type="submit">Search</button>
  </form>

  <section class="destinations">
    <h3>Popular Destinations</h3>
    <div class="cards">
      <div class="card">
        <img src="https://picsum.photos/seed/goa/400/200" alt="Goa">
        <div class="card-body"><h4>Goa</h4><p>Beaches & nightlife</p></div>
      </div>
      <div class="card">
        <img src="https://picsum.photos/seed/manali/400/200" alt="Manali">
        <div class="card-body"><h4>Manali</h4><p>Mountains & adventure</p></div>
      </div>
      <div class="card">
        <img src="https://picsum.photos/seed/jaipur/400/200" alt="Jaipur">
        <div class="card-body"><h4>Jaipur</h4><p>Forts & culture</p></div>
      </div>
      <div class="card">
        <img src="https://picsum.photos/seed/kerala/400/200" alt="Kerala">
        <div class="card-body"><h4>Kerala</h4><p>Backwaters & greenery</p></div>
      </div>
    </div>
  </section>

  <footer>
    &copy; 2026 MyTravelSite. Built as a simple demo template.
  </footer>

  <script>
    function handleSearch(e) {
      e.preventDefault();
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      const departure = document.getElementById('departure').value;
      alert(`Searching flights from ${from} to ${to} on ${departure}`);
      // Replace this with a real API call or redirect to your results page
    }
  </script>

</body>
</html>
